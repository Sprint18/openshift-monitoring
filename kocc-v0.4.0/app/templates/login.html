<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOCC · Giriş</title>
<style>
:root{--navy:#062b55;--orange:#f58220;--line:#d9e2ec;--muted:#61758a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font:14px system-ui;color:#102a43}.login{width:min(410px,calc(100% - 32px));background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 18px 50px #1232}.brand{display:flex;gap:14px;align-items:center;margin-bottom:25px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{font-size:20px;margin:0;color:var(--navy)}.brand p{margin:3px 0 0;color:var(--muted)}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px}button{width:100%;margin-top:20px;padding:11px;border:0;border-radius:8px;color:white;background:var(--navy);font-weight:700;cursor:pointer}button:hover{background:#0b477f}.error{background:#fff1f1;color:#a61b1b;padding:10px;border-radius:7px}</style></head>
<body><main class="login"><div class="brand"><img src="/static/kkb-turuncu-lacivert-logo.png" alt="KKB"><div><h1>OpenShift Clusters Monitoring Platform</h1><p>OpenShift Operations Portal</p></div></div>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next_path }}"><label for="username">Kullanıcı adı</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Parola</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Giriş Yap</button></form></main></body></html>
