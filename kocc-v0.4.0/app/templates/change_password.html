<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KOCC · Parola Değiştir</title>
    <link rel="stylesheet" href="/static/portal_theme.css">
    <script src="/static/portal_theme.js"></script>
    <style>
        body{margin:0;background:var(--page-bg,#f3f6fa);font:14px system-ui;color:var(--text-primary,#102a43)}
        .box{max-width:480px;margin:70px auto;background:var(--panel-bg,#fff);border:1px solid var(--border-color,#d9e2ec);border-radius:14px;padding:28px}
        h1{color:var(--heading-color,#062b55)}label{display:block;font-weight:650;margin:14px 0 6px}
        input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border-color,#ccd8e5);border-radius:7px;background:var(--input-bg,#fff);color:var(--text-primary,#102a43)}
        button,a{display:inline-block;margin-top:18px;padding:10px 15px;border:0;border-radius:7px;background:#062b55;color:#fff;text-decoration:none;font-weight:700}
        button:disabled{opacity:.6;cursor:wait}.logout{background:#60758a}.message{padding:10px;border-radius:7px}.error{background:#fff1f1;color:#a61b1b}.success{background:#ecf9f1;color:#14733c}
    </style>
</head>
<body>
<main class="box">
    <h1>Parola Değiştir</h1>
    {% if error %}<p class="message error">{{ error }}</p>{% endif %}
    {% if success %}<p class="message success">{{ success }}</p>{% endif %}
    <form method="post" id="password-form">
        <label for="current">Mevcut parola</label><input id="current" name="current_password" type="password" required>
        <label for="new">Yeni parola</label><input id="new" name="new_password" type="password" required>
        <label for="confirm">Yeni parola tekrar</label><input id="confirm" name="confirm_password" type="password" required>
        <button type="submit">Parolayı Güncelle</button> <a href="/">Geri Dön</a>
    </form>
    <form method="post" action="/logout"><button class="logout" type="submit">Çıkış Yap</button></form>
</main>
<script>
document.getElementById("password-form").addEventListener("submit",event=>{const button=event.currentTarget.querySelector('button[type="submit"]');if(button.disabled){event.preventDefault();return}button.disabled=true;button.textContent="Güncelleniyor…"});
</script>
</body>
</html>
