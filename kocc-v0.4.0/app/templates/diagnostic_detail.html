<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pod Diagnostic Detail</title>
<style>
:root{--navy:#132b4f;--orange:#f58220;--border:#d8dee6}*{box-sizing:border-box}body{margin:0;background:#f4f5f5;color:#151515;font-family:Arial,sans-serif}header{padding:16px 32px;color:white;background:var(--navy);border-bottom:4px solid var(--orange)}header a{color:white}.primary-nav{display:flex;gap:4px;padding:0 32px;overflow:auto;background:#0d213d}.primary-nav a{padding:11px 14px;color:#dbe5ef;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}.primary-nav a.active,.primary-nav a:hover{color:white;border-color:var(--orange);background:rgba(255,255,255,.06)}main{padding:24px 32px 48px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{padding:18px;background:white;border:1px solid var(--border);border-top:3px solid var(--orange);border-radius:8px}.wide{grid-column:1/-1}.critical{border-top-color:#c9190b}.warning{border-top-color:#f58220}.info{border-top-color:#2b7bbb}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;overflow-wrap:anywhere}.table-wrap{overflow-x:auto}pre{max-height:420px;overflow:auto;padding:14px;border-radius:6px;background:#101820;color:#e8edf2;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.field{display:grid;gap:4px}select,button{padding:8px 10px;border:1px solid #8a8d90;border-radius:4px;background:white}.loading::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid #bbb;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{padding:24px 8px 12px;color:#999;opacity:.75;text-align:center;font-size:11px}@media(max-width:700px){header,main{padding-left:16px;padding-right:16px}.primary-nav{padding:0 16px}}
</style>
</head>
<body>
<header><a href="/diagnostics?cluster={{ selected_cluster }}">← Diagnostics</a><h1>{{ namespace }} / {{ pod_name }}</h1><div>{{ selected_cluster_name }} · Read-only</div></header>
{% include "_navigation.html" %}
<main><div id="detail-root" class="loading">Loading pod diagnostic data</div></main>
<footer>Bu uygulama Oğuzhan Alkın Sözen tarafından AI araçları kullanılarak geliştirilmiştir.</footer>
<script>
const cluster={{ selected_cluster|tojson }}, namespace={{ namespace|tojson }}, podName={{ pod_name|tojson }};
const escapeHtml=(value)=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const root=document.getElementById("detail-root");
const loadDetail=async()=>{const container=document.getElementById("container-select")?.value||"";const tail=document.getElementById("tail-select")?.value||"200";root.classList.add("loading");try{const response=await fetch(`/api/diagnostics/${encodeURIComponent(namespace)}/${encodeURIComponent(podName)}?cluster=${encodeURIComponent(cluster)}&container=${encodeURIComponent(container)}&tail=${tail}`);if(!response.ok)throw new Error();const data=await response.json(),pod=data.pod,analysis=data.analysis;root.classList.remove("loading");root.innerHTML=`<div class="grid">
<section class="card"><h2>Status Summary</h2><p><strong>${escapeHtml(pod.phase)}</strong> · Node ${escapeHtml(pod.node)}</p><p>Pod IP: ${escapeHtml(pod.pod_ip)}<br>Started: ${escapeHtml(pod.start_time)}<br>Owner: ${escapeHtml(pod.owner)}<br>Restarts: ${pod.restart_count}</p></section>
<section class="card ${escapeHtml(analysis.severity)}"><h2>Muhtemel Neden</h2><p>${escapeHtml(analysis.cause)}</p><h3>Kanıtlar</h3><ul>${analysis.evidence.map((item)=>`<li>${escapeHtml(item)}</li>`).join("")}</ul><h3>Önerilen Kontroller</h3><ul>${analysis.checks.map((item)=>`<li>${escapeHtml(item)}</li>`).join("")}</ul></section>
<section class="card wide"><h2>Containers</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Image</th><th>Ready</th><th>Restarts</th><th>State</th><th>Waiting</th><th>Terminated / Exit</th><th>Last State</th></tr></thead><tbody>${pod.containers.map((item)=>`<tr><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.image)}</td><td>${item.ready}</td><td>${item.restart_count}</td><td>${escapeHtml(item.current_state)}</td><td>${escapeHtml(item.waiting_reason)}<br>${escapeHtml(item.waiting_message)}</td><td>${escapeHtml(item.terminated_reason)} / ${escapeHtml(item.exit_code)}<br>signal ${escapeHtml(item.signal)}<br>${escapeHtml(item.started_at)} — ${escapeHtml(item.finished_at)}</td><td>${escapeHtml(item.last_terminated_reason)} / ${escapeHtml(item.last_exit_code)}<br>${escapeHtml(item.last_started_at)} — ${escapeHtml(item.last_finished_at)}</td></tr>`).join("")}</tbody></table></div></section>
<section class="card wide"><h2>Events</h2>${data.events.length?`<div class="table-wrap"><table><thead><tr><th>Type</th><th>Reason</th><th>Message</th><th>Count</th><th>Last Timestamp</th></tr></thead><tbody>${data.events.map((event)=>`<tr><td>${escapeHtml(event.type)}</td><td>${escapeHtml(event.reason)}</td><td>${escapeHtml(event.message)}</td><td>${event.count}</td><td>${escapeHtml(event.last_timestamp)}</td></tr>`).join("")}</tbody></table></div>`:"<p>No pod events</p>"}</section>
<section class="card wide"><h2>Container Logs</h2><div class="toolbar"><div class="field"><label>Container</label><select id="container-select">${pod.containers.map((item)=>`<option value="${escapeHtml(item.name)}"${item.name===data.logs.container?" selected":""}>${escapeHtml(item.name)}</option>`).join("")}</select></div><div class="field"><label>Tail</label><select id="tail-select">${[50,100,200,500].map((value)=>`<option value="${value}"${String(value)===String(tail)?" selected":""}>${value}</option>`).join("")}</select></div><button id="reload-logs">Reload</button><button id="copy-logs">Copy current log</button></div><h3>Current</h3><pre id="current-log">${escapeHtml(data.logs.current||"No current log available")}</pre><h3>Previous</h3><pre>${escapeHtml(data.logs.previous_available?data.logs.previous:"Previous log unavailable")}</pre></section>
</div>`;document.getElementById("reload-logs").addEventListener("click",loadDetail);document.getElementById("copy-logs").addEventListener("click",()=>navigator.clipboard.writeText(data.logs.current||""));}catch(_error){root.classList.remove("loading");root.textContent="Pod diagnostic data unavailable";}};
loadDetail();
</script>
</body>
</html>
