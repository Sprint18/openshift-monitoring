<link rel="icon" href="/static/kkb-turuncu-lacivert-logo.png">
<link rel="stylesheet" href="/static/shiftlight_assistant.css">
<div id="shiftlight-root" data-initial-cluster="{{ selected_cluster }}" data-open-on-load="{{ 'true' if page == 'ai-assistant' else 'false' }}">
    <div id="shiftlight-nudge" class="shiftlight-nudge" hidden role="status">
        <button id="shiftlight-nudge-close" type="button" aria-label="ShiftLight karşılama mesajını kapat">×</button>
        <img src="/static/shiftlight-mascot.png" alt="" aria-hidden="true"><div><strong>Merhaba 👋</strong><span>Ben KKB ShiftLight AI.<br>OpenShift desteği için buradayım.</span></div>
    </div>
    <button id="shiftlight-launcher" class="shiftlight-launcher" type="button" aria-label="KKB ShiftLight AI asistanını aç" aria-controls="shiftlight-drawer" aria-expanded="false">
        <img class="shiftlight-launcher-mascot" src="/static/shiftlight-mascot.png" alt="" aria-hidden="true"><span>KKB ShiftLight AI</span>
    </button>
    <div id="shiftlight-overlay" class="shiftlight-overlay" hidden></div>
    <aside id="shiftlight-drawer" class="shiftlight-drawer" role="dialog" aria-modal="false" aria-label="KKB ShiftLight AI" aria-hidden="true">
        <header class="shiftlight-header">
            <div class="shiftlight-brand"><img src="/static/kkb-turuncu-lacivert-logo.png" alt="KKB"><div><strong>KKB ShiftLight AI</strong><small>OpenShift Operasyon Asistanı</small></div></div>
            <div class="shiftlight-header-actions"><span class="shiftlight-readonly">Read-only</span><button id="shiftlight-close" type="button" aria-label="Asistanı kapat">×</button></div>
        </header>
        <div class="shiftlight-toolbar">
            <label for="shiftlight-cluster">Cluster<select id="shiftlight-cluster" disabled><option>Yükleniyor…</option></select></label>
            <div><button id="shiftlight-history-toggle" type="button" aria-controls="shiftlight-history" aria-expanded="false">Sohbetler</button><button id="shiftlight-new" type="button">Yeni Sohbet</button></div>
        </div>
        <div id="shiftlight-history" class="shiftlight-history" hidden><div class="shiftlight-history-title"><strong>Sohbetler</strong><button id="shiftlight-history-close" type="button" aria-label="Sohbet listesini kapat">×</button></div><div id="shiftlight-history-list" class="shiftlight-history-list"></div></div>
        <section id="shiftlight-conversation" class="shiftlight-conversation" aria-live="polite"></section>
        <form id="shiftlight-form" class="shiftlight-composer">
            <label for="shiftlight-message" class="shiftlight-sr-only">OpenShift sorunuzu yazın</label>
            <textarea id="shiftlight-message" rows="1" required placeholder="ShiftLight AI'ya OpenShift hakkında sorunuzu yazın..."></textarea>
            <div><span id="shiftlight-status" role="status" aria-live="polite"></span><button id="shiftlight-send" type="submit" disabled aria-label="Mesajı gönder">Gönder</button></div>
            <small>Enter gönderir · Shift+Enter yeni satır</small>
        </form>
    </aside>
</div>
<script src="/static/shiftlight_assistant.js" defer></script>
