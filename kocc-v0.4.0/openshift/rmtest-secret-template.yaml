apiVersion: v1
kind: Secret
metadata:
  name: kocc-remote-clusters
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
type: Opaque
stringData:
  rmtest.kubeconfig: |
    # Bu alanı RMTEST kubeconfig dosyasının TAM içeriği ile değiştirin.
    # Python kodunda host, token veya CA tanımlanmaz.
    # Secret oluşturmak için önerilen yöntem:
    #
    # oc -n kocc create secret generic kocc-remote-clusters \
    #   --from-file=rmtest.kubeconfig=./rmtest.kubeconfig \
    #   --dry-run=client -o yaml | oc apply -f -
