apiVersion: v1
kind: ServiceAccount
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kocc-readonly
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
  - apiGroups:
      - config.openshift.io
    resources:
      - clusteroperators
    verbs:
      - get
      - list
  - apiGroups:
      - k8s.ovn.org
    resources:
      - egressips
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kocc-readonly
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
subjects:
  - kind: ServiceAccount
    name: kocc
    namespace: ocp-monitoring-portal-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kocc-readonly
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  labels:
    app.kubernetes.io/name: kocc
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: kocc:0.4.0
      namespace: ocp-monitoring-portal-test
  triggers: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"kocc:0.4.0","namespace":"ocp-monitoring-portal-test"},"fieldPath":"spec.template.spec.containers[?(@.name==\"kocc\")].image","paused":false}]
  labels:
    app.kubernetes.io/name: kocc
    app.kubernetes.io/version: "0.4.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kocc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kocc
        app.kubernetes.io/version: "0.4.0"
      annotations:
        dynatrace.com/inject: "false"
    spec:
      serviceAccountName: kocc
      securityContext:
        fsGroup: 1002940000
      containers:
        - name: kocc
          image: image-registry.openshift-image-registry.svc:5000/ocp-monitoring-portal-test/kocc:0.4.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KOCC_AUTH_ENABLED
              value: "true"
            - name: KOCC_AUTH_COOKIE_SECURE
              value: "true"
            - name: KOCC_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kocc-auth
                  key: admin-username
            - name: KOCC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kocc-auth
                  key: admin-password
            - name: KOCC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: kocc-auth
                  key: session-secret
            - name: KOCC_PATCH_ENABLED
              value: "true"
            - name: KOCC_PATCH_BACKEND_URL
              value: http://ocp-patch-master.ocp-patch-agent.svc.cluster.local:8090
            - name: KOCC_PATCH_TIMEOUT_SECONDS
              value: "5"
            - name: KOCC_PATCH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kocc-patch-api
                  key: api-token
                  optional: true
            - name: KOCC_AI_BACKEND_URL
              value: http://kocc-ai-backend.test-openshift-ai-assistant.svc.cluster.local:8080
            - name: KOCC_AI_BACKEND_TIMEOUT_SECONDS
              value: "90"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: remote-clusters
              mountPath: /etc/portal/clusters
              readOnly: true
            - name: kocc-data
              mountPath: /data
      volumes:
        - name: remote-clusters
          secret:
            secretName: kocc-remote-clusters
            items:
              - key: rmtest.kubeconfig
                path: rmtest.kubeconfig
            defaultMode: 0440
        - name: kocc-data
          persistentVolumeClaim:
            claimName: kocc-data
---
apiVersion: v1
kind: Service
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  labels:
    app.kubernetes.io/name: kocc
spec:
  selector:
    app.kubernetes.io/name: kocc
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kocc
  namespace: ocp-monitoring-portal-test
  annotations:
    haproxy.router.openshift.io/timeout: 120s
  labels:
    app.kubernetes.io/name: kocc
spec:
  to:
    kind: Service
    name: kocc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
